name: Generate package lockfile

on:
  push:
    branches:
      - feature/enterprise-operations

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json was not generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git commit -m "chore: add package lockfile"
          git push origin HEAD:feature/enterprise-operations
