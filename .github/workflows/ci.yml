name: Vimba Ops CI
on:
  push:
    branches: [main, production-enterprise, hardening/code-foundation, feature/ai-intelligence, feature/enterprise-operations]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vimba-ops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/enterprise-operations'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package lockfile"
          git push origin HEAD:feature/enterprise-operations
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run security:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
